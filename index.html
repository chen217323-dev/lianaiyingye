function orders(){return shell('<h2 class="title">🛍️ 我的订单</h2>'+(s.orders.length?s.orders.map(o=>'<div class="panel"><div class="row"><b>#'+o.id+' · '+esc(o.name)+'</b><span class="status">'+esc(o.status)+'</span></div><p class="muted">备注：'+esc(o.note||"没有特殊要求")+'</p><p class="muted">'+esc(o.time)+' · '+o.price+' 积分</p>'+(o.status==='待接单'?'<button class="btn warn" onclick="app.cancel('+o.id+')">取消并退款</button>':'')+'</div>').join(''):'<div class="empty">暂时没有订单，老板正在摸鱼 💤</div>'))}
function wallet(){return shell('<h2 class="title">◎ 我的宠爱币</h2><div class="coin"><div class="big">'+s.points+' ◎</div>今日签到：'+(s.lastSign===today()?'已领取 ✓':'尚未领取')+'</div><h3>积分流水</h3>'+(s.log.length?s.log.map(l=>'<div class="panel row"><div><b>'+esc(l.reason)+'</b><p class="muted">'+esc(l.date)+'</p></div><b class="price">'+(l.n>0?'+':'')+l.n+'</b></div>').join(''):'<div class="empty">还没有积分记录</div>'))}
function rewards(){return shell('<h2 class="title">🎁 奖励中心</h2><p class="muted">现阶段积分主要用于点菜，更多兑换福利后续开放。</p><div class="panel">🍜 现在就可以用积分兑换食物！<p><button class="btn" onclick="app.go(\'menu\')">去点菜 →</button></p></div>')}
function owner(){const pending=s.orders.filter(o=>o.status==='待接单').length;const reqs=s.requests.filter(r=>r.status==='pending');return shell('<h2 class="title">😎 老板指挥中心</h2><div class="notice">欢迎全能打工人。顾客的满意度就是你的KPI。</div><div class="grid"><div class="tile"><span class="em">📦</span><b>'+s.orders.length+'单</b><p>累计订单</p></div><div class="tile"><span class="em">🛎️</span><b>'+pending+'单</b><p>待接订单</p></div><div class="tile"><span class="em">📝</span><b>'+reqs.length+'件</b><p>任务待审</p></div></div><div class="panel"><h3>任务审核</h3>'+(reqs.length?reqs.map(r=>{const t=s.tasks.find(t=>t.id===r.task);return '<div class="list"><div class="desc"><b>'+esc(t?.name||'任务')+'</b><p>申请奖励 +'+(t?.points||0)+' ◎</p></div><button class="btn" onclick="app.review('+r.id+',true)">批准</button><button class="btn warn" onclick="app.review('+r.id+',false)">驳回</button></div>'}).join(''):'<p class="muted">目前没有待审核任务</p>')+'</div><div class="panel"><h3>所有订单</h3>'+(s.orders.length?s.orders.map(o=>'<div class="list"><div class="desc"><b>'+esc(o.name)+'</b><p>#'+o.id+' · '+esc(o.status)+'</p><p>'+esc(o.note)+'</p></div><button class="btn" onclick="app.next('+o.id+')" '+(['已送达','已取消'].includes(o.status)?'disabled':'')+'>'+({待接单:'接单',制作中:'送达'}[o.status]||'已完结')+'</button></div>').join(''):'<p class="muted">没有订单，今天暂时不用打工</p>')+'</div>')}
function edit(){return shell('<h2 class="title">🧑‍🍳 菜单管理</h2><div class="panel"><h3>新增菜品</h3><label>菜品名称</label><input id="newname" placeholder="例如：番茄牛腩"><label>积分价格</label><input id="newprice" type="number" min="1" value="80"><label>表情图标</label><input id="newemoji" value="🍲"><button style="margin-top:12px" class="btn" onclick="app.addMenu()">新增菜品</button></div>'+s.menu.map(i=>'<div class="panel list"><div class="face">'+esc(i.emoji)+'</div><div class="desc"><b>'+esc(i.name)+'</b><p>'+i.price+' 积分 · '+(i.on?'售卖中':'已下架')+'</p></div><div class="edit"><button class="btn light" onclick="app.toggle('+i.id+')">'+(i.on?'下架':'上架')+'</button><button class="btn warn" onclick="app.remove('+i.id+')">删除</button></div></div>').join(''))}
function about(){return shell('<h2 class="title">📖 营业须知</h2><div class="panel"><h3>这是一家只属于你们的小店</h3><p>每天签到可领取50积分；积分可以买菜；积分不足可完成任务；任务由老板审核；订单取消可退款。</p><p class="muted">当前为 GitHub Pages 本地演示版。每部手机独立存储数据，双方数据暂不能实时同步。需要云数据库才能让女朋友下单后老板的另一台手机自动收到。</p></div>')}
function render(){if(s.role==='owner'&&!['owner','edit','about'].includes(s.tab))s.tab='owner';if(s.role==='customer'&&['owner','edit'].includes(s.tab))s.tab='home';$('rolelabel').textContent=s.role==='owner'?'🧑‍🍳 老板专属指挥部':'👑 尊贵顾客专用通道';$('switchbtn').textContent=s.role==='owner'?'切换女友端 ⇄':'切换老板端 ⇄';let views={home,menu,tasks,orders,wallet,rewards,owner,edit,about};$('view').innerHTML=(views[s.tab]||home)();let tabs=s.role==='owner'?[['owner','📦','订单'],['edit','🍳','菜单'],['about','📖','说明']]:[['home','🏠','首页'],['menu','🍜','点菜'],['tasks','📋','任务'],['orders','🛍️','订单'],['wallet','◎','积分']];$('nav').innerHTML=tabs.map(t=>'<button class="'+(s.tab===t[0]?'on':'')+'" onclick="app.go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>').join('');save()}
window.app={go:t=>{s.tab=t;render();window.scrollTo(0,0)},sign:()=>{if(s.lastSign===today())return alert('今天已经领过50积分了！');s.lastSign=today();addPoints(50,'每日签到');render();alert('签到成功！+50宠爱币，公主请消费！')},buy:id=>{const i=s.menu.find(i=>i.id===id);if(!i||!i.on)return; if(s.points<i.price){if(confirm('积分还差 '+(i.price-s.points)+' ◎！去完成任务吗？')){s.tab='tasks';render()}return}const note=prompt('老板有什么需要注意的？例如：不要葱，多放爱（可留空）','');if(note===null)return; if(!confirm('花费 '+i.price+' 积分点「'+i.name+'」？'))return;addPoints(-i.price,'下单：'+i.name);s.orders.unshift({id:Date.now(),name:i.name,price:i.price,note:note.slice(0,200),status:'待接单',time:new Date().toLocaleString()});s.tab='orders';render();alert('下单成功！老板，请端正服务态度！')},apply:id=>{if(s.requests.some(r=>r.task===id&&r.date===today()))return;const t=s.tasks.find(t=>t.id===id);if(!t)return;if(!confirm('确定已完成「'+t.name+'」？申请老板审核。'))return;s.requests.push({id:Date.now(),task:id,status:'pending',date:today()});render();alert('申请已提交，等待老板审批！')},review:(id,yes)=>{const r=s.requests.find(r=>r.id===id);if(!r||r.status!=='pending')return;r.status=yes?'approved':'rejected';const t=s.tasks.find(t=>t.id===r.task);if(yes&&t)addPoints(t.points,'完成任务：'+t.name);render()},next:id=>{const o=s.orders.find(o=>o.id===id);if(!o)return;if(o.status==='待接单')o.status='制作中';else if(o.status==='制作中')o.status='已送达';render()},cancel:id=>{const o=s.orders.find(o=>o.id===id);if(!o||o.status!=='待接单'||!confirm('确定取消并退款吗？'))return;o.status='已取消';addPoints(o.price,'订单取消退款');render()},addMenu:()=>{const name=$('newname').value.trim(),price=Number($('newprice').value),emoji=$('newemoji').value.trim()||'🍲';if(!name||name.length>40||!Number.isInteger(price)||price<1||price>100000)return alert('请填写有效菜名和价格');s.menu.push({id:Date.now(),name,price,emoji:emoji.slice(0,8),desc:'老板特供',on:true});render()},toggle:id=>{const i=s.menu.find(i=>i.id===id);if(i)i.on=!i.on;render()},remove:id=>{if(!confirm('确定删除菜品？'))return;s.menu=s.menu.filter(i=>i.id!==id);render()}};
$('switchbtn').onclick=()=>{s.role=s.role==='owner'?'customer':'owner';s.tab=s.role==='owner'?'owner':'home';render()};render()
})();
</script></body></html>

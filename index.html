  const editor='<div class="panel"><div class="row"><h3>'+(selected?'✏️ 编辑菜品':'➕ 新增菜品')+'</h3>'+(selected?'<button class="btn light" onclick="app.closeEdit()">取消编辑</button>':'')+'</div>'
    +'<label>菜品名称</label><input id="dishName" maxlength="50" value="'+esc(selected?.name||'')+'" placeholder="例如：陈哥招牌米线">'
    +'<div class="form-row"><div><label>菜品分类</label><input list="menuCategories" id="dishCategory" maxlength="20" value="'+esc(selected?.category||'素菜类')+'"><datalist id="menuCategories">'+options+'</datalist></div>'
    +'<div><label>积分价格</label><input type="number" min="1" max="100000" id="dishPrice" value="'+esc(selected?.price||50)+'"></div></div>'
    +'<div class="form-row"><div><label>图标（表情）</label><input maxlength="12" id="dishEmoji" value="'+esc(selected?.emoji||'🍽️')+'"></div><div><label>售卖状态</label><select id="dishEnabled"><option value="1" '+(selected?.on!==false?'selected':'')+'>上架</option><option value="0" '+(selected?.on===false?'selected':'')+'>下架</option></select></div></div>'
    +'<label>菜品描述（可选）</label><textarea id="dishDesc" rows="2" maxlength="160" placeholder="这道菜的特色">'+esc(selected?.desc||'')+'</textarea>'
    +'<button class="btn wide" style="margin-top:14px" onclick="app.saveDish()">'+(selected?'保存修改':'添加到菜单')+'</button></div>';
  const body=s.menu.map((i,index)=>'<div class="panel list manage-dish"><div class="face">'+esc(i.emoji)+'</div><div class="desc"><b>'+esc(i.name)+'</b><p>'+esc(i.category||"其他")+' · '+i.price+' ◎ · '+(i.on?'上架中':'已下架')+'</p></div><div class="manage-buttons"><button class="btn light" onclick="app.editDish('+i.id+')">编辑</button><button class="btn '+(i.on?'warn':'light')+'" onclick="app.toggle('+i.id+')">'+(i.on?'下架':'上架')+'</button><button class="btn light" title="上移" '+(index===0?'disabled':'')+' onclick="app.shiftDish('+i.id+',-1)">↑</button><button class="btn light" title="下移" '+(index===s.menu.length-1?'disabled':'')+' onclick="app.shiftDish('+i.id+',1)">↓</button><button class="btn warn" onclick="app.remove('+i.id+')">删除</button></div></div>').join('');
  return shell('<h2 class="title">👩‍🍳 自定义菜单</h2><div class="notice">老公专属：可随时新增、修改、删除、上下架和重新排序。菜单更改后即刻生效（当前仅此浏览器可见）。</div>'
     +'<div class="panel"><div class="row"><div><b>我的菜单</b><p class="muted">'+s.menu.length+' 道菜 · '+s.menu.filter(i=>i.on).length+' 道在售</p></div><button class="btn light" onclick="app.restoreMenu()">恢复22道初始菜单</button></div></div>'
     +editor
     +'<h3>全部菜品</h3>'+(s.menu.length?body:'<div class="empty">菜单暂时为空，点击上方新增菜品 ☁️</div>')
     +'<details class="panel bulk"><summary>📋 批量重做菜单 / 一键清空</summary><p class="muted">每行：分类 | 菜名 | 积分 | 图标（最后一项可省略）</p>'
     +'<textarea id="bulktext" rows="5" placeholder="素菜类 | 番茄豆腐 | 45 | 🍅&#10;肉类 | 陈哥黄焖鸡 | 110 | 🍗"></textarea>'
     +'<div class="actions"><button class="btn warn" onclick="app.replaceMenu()">用以上内容替换全部菜单</button><button class="btn light" onclick="app.clearMenu()">清空重做</button></div>'
     +'<p class="muted">⚠️ 替换和清空前会二次确认。删除菜品不会删除历史订单。</p></details>'
     +'<div class="footerNote">提醒：GitHub Pages 当前使用本地浏览器存储。换设备或清除浏览器数据可能丢失自定义菜单，也不会自动更新老婆的另一台手机。</div>')
}
function taskEdit(){
  const item=editingTaskId===null?null:s.tasks.find(t=>t.id===editingTaskId);
  const options=taskCats.map(c=>'<option value="'+esc(c)+'"></option>').join('');
  const form='<div class="panel"><div class="row"><h3>'+(item?"✏️ 编辑任务":"➕ 新增心动任务")+'</h3>'+(item?'<button class="btn light" onclick="app.cancelTaskEdit()">取消编辑</button>':'')+'</div>'
   +'<label>任务名称</label><input maxlength="55" id="taskName" value="'+esc(item?.name||"")+'" placeholder="比如：给老公一个亲亲">'
   +'<div class="form-row"><div><label>任务分类</label><input maxlength="20" id="taskCategoryInput" list="taskCatsList" value="'+esc(item?.category||"甜蜜互动")+'"><datalist id="taskCatsList">'+options+'</datalist></div>'
   +'<div><label>获得积分</label><input type="number" min="1" max="10000" id="taskPoints" value="'+esc(item?.points||25)+'"></div></div>'
   +'<div class="form-row"><div><label>小图标</label><input id="taskEmoji" maxlength="12" value="'+esc(item?.emoji||"💌")+'"></div>'
   +'<div><label>显示状态</label><select id="taskEnabled"><option value="1" '+(item?.on!==false?"selected":"")+' >上架</option><option value="0" '+(item?.on===false?"selected":"")+'>隐藏</option></select></div></div>'
   +'<label>任务说明</label><textarea id="taskDesc" rows="3" maxlength="200" placeholder="任务怎么玩">'+esc(item?.desc||"")+'</textarea>'
   +'<button class="btn wide" style="margin-top:12px" onclick="app.saveTask()">'+(item?"保存任务":"发布任务")+'</button></div>';
  const list=s.tasks.map(t=>'<div class="panel list manage-dish"><div class="face">'+esc(t.emoji||"💌")+'</div><div class="desc"><b>'+esc(t.name)+'</b><p>'+esc(t.category||"自定义")+' · +'+Number(t.points)+' ◎ · '+(t.on===false?"已隐藏":"展示中")+'</p></div>'
   +'<div class="manage-buttons"><button class="btn light" onclick="app.editTask('+t.id+')">编辑</button><button class="btn '+(t.on===false?"light":"warn")+'" onclick="app.toggleTask('+t.id+')">'+(t.on===false?"显示":"隐藏")+'</button><button class="btn warn" onclick="app.removeTask('+t.id+')">删除</button></div></div>').join('');
  return shell('<h2 class="title">💌 积分任务管理</h2>'
   +'<div class="notice">老公可以自己发布小情趣任务、修改奖励积分、隐藏或删除任务。任务要双方自愿，亲密邀请不能设置成必须履行。</div>'
   +'<div class="panel row"><div><b>我的任务列表</b><p class="muted">'+s.tasks.length+' 个任务，'+s.tasks.filter(t=>t.on!==false).length+' 个展示中</p></div><button class="btn light" onclick="app.restoreTasks()">恢复默认任务</button></div>'
   +form
   +'<h3>已发布任务</h3>'+(s.tasks.length?list:'<div class="empty">暂时没有任务，新增一个试试！</div>')
   +'<div class="footerNote">当前积分和任务修改保存在本浏览器，尚不能同步到老婆的另一台手机。</div>')
}
function about(){return shell('<h2 class="title">📖 营业须知</h2><div class="panel"><h3>这是一家只属于你们的小店</h3><p>每天签到可领取50积分；积分可以买菜；积分不足可完成任务；任务由老公审核；订单取消可退款。</p><p class="muted">当前为 GitHub Pages 本地演示版。每部手机独立存储数据，双方数据暂不能实时同步。需要云数据库才能让老婆下单后老公的另一台手机自动收到。</p></div>')}
function render(){if(s.role==='owner'&&!['owner','edit','taskEdit','about'].includes(s.tab))s.tab='owner';if(s.role==='customer'&&['owner','edit','taskEdit'].includes(s.tab))s.tab='home';$('rolelabel').textContent=s.role==='owner'?'🧑‍🍳 老公专属指挥部':'👑 老婆专属通道';$('switchbtn').textContent=s.role==='owner'?'切换老婆端 ⇄':'切换老公端 ⇄';let views={home,menu,tasks,orders,wallet,rewards,owner,edit,taskEdit,about};$('view').innerHTML=(views[s.tab]||home)();let tabs=s.role==='owner'?[['owner','📦','订单'],['edit','🍳','菜单'],['taskEdit','💌','任务'],['about','📖','说明']]:[['home','🏠','首页'],['menu','🍜','点菜'],['tasks','📋','任务'],['orders','🛍️','订单'],['wallet','◎','积分']];$('nav').innerHTML=tabs.map(t=>'<button class="'+(s.tab===t[0]?'on':'')+'" onclick="app.go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>').join('');save()}
window.app={
taskCategory:c=>{taskCategory=c;render()},
editTask:id=>{editingTaskId=id;s.tab="taskEdit";render();window.scrollTo(0,0)},
cancelTaskEdit:()=>{editingTaskId=null;render()},
saveTask:()=>{
 const name=$("taskName").value.trim(),category=$("taskCategoryInput").value.trim()||"自定义",
 points=Number($("taskPoints").value),emoji=$("taskEmoji").value.trim()||"💌",
 desc=$("taskDesc").value.trim(),on=$("taskEnabled").value==="1";
 if(!name||name.length>55||category.length>20||!Number.isInteger(points)||points<1||points>10000)return alert("请填写有效任务名、分类和积分（1-10000）");
 if(editingTaskId===null){
  const id=Math.max(20,Date.now(),...s.tasks.map(t=>t.id+1));
  s.tasks.push({id,name,category,points,emoji,desc,on,inviteOnly:false});
 }else{
  const t=s.tasks.find(t=>t.id===editingTaskId);if(!t)return alert("任务不存在");
  Object.assign(t,{name,category,points,emoji,desc,on});
 }
 editingTaskId=null;render();alert("任务保存成功！")
},
toggleTask:id=>{const t=s.tasks.find(t=>t.id===id);if(t){t.on=t.on===false;render()}},
removeTask:id=>{
 const t=s.tasks.find(t=>t.id===id);
 if(!t||!confirm("确定删除任务「"+t.name+"」吗？"))return;
 if(s.requests.some(r=>r.task===id&&r.status==="pending"))return alert("该任务还有待审核申请，请先处理后再删除");
 s.tasks=s.tasks.filter(x=>x.id!==id);
 if(editingTaskId===id)editingTaskId=null;
 render()
},
restoreTasks:()=>{
 if(!confirm("恢复所有默认任务？将覆盖当前自定义任务，已赚到的积分不会消失。"))return;
 s.tasks=JSON.parse(JSON.stringify(taskOriginalDetails));editingTaskId=null;taskCategory="全部";render()
},
go:t=>{s.tab=t;render();window.scrollTo(0,0)},sign:()=>{if(s.lastSign===today())return alert('今天已经领过50积分了！');s.lastSign=today();addPoints(50,'每日签到');render();alert('签到成功！+50宠爱币，公主请消费！')},buy:id=>{const i=s.menu.find(i=>i.id===id);if(!i||!i.on)return; if(s.points<i.price){if(confirm('积分还差 '+(i.price-s.points)+' ◎！去完成任务吗？')){s.tab='tasks';render()}return}const note=prompt('老公有什么需要注意的？例如：不要葱，多放爱（可留空）','');if(note===null)return; if(!confirm('花费 '+i.price+' 积分点「'+i.name+'」？'))return;addPoints(-i.price,'下单：'+i.name);s.orders.unshift({id:Date.now(),name:i.name,price:i.price,note:note.slice(0,200),status:'待接单',time:new Date().toLocaleString()});s.tab='orders';render();alert('下单成功！老公，请端正服务态度！')},apply:id=>{if(s.requests.some(r=>r.task===id&&r.date===today()))return;const t=s.tasks.find(t=>t.id===id);if(!t||t.on===false)return;const promptText=t.inviteOnly?'只需自愿发出邀约即可申请积分，是否亲密由双方决定，无须证明。确定已发出邀请吗？':'确定已完成「'+t.name+'」？申请老公审核。';if(!confirm(promptText))return;s.requests.push({id:Date.now(),task:id,taskName:t.name,points:t.points,status:'pending',date:today()});render();alert('申请已提交，等待老公审批！')},review:(id,yes)=>{const r=s.requests.find(r=>r.id===id);if(!r||r.status!=='pending')return;r.status=yes?'approved':'rejected';const t=s.tasks.find(t=>t.id===r.task);if(yes)addPoints(t?.points||r.points||0,'完成任务：'+(t?.name||r.taskName||'任务'));render()},next:id=>{const o=s.orders.find(o=>o.id===id);if(!o)return;if(o.status==='待接单')o.status='制作中';else if(o.status==='制作中')o.status='已送达';render()},cancel:id=>{const o=s.orders.find(o=>o.id===id);if(!o||o.status!=='待接单'||!confirm('确定取消并退款吗？'))return;o.status='已取消';addPoints(o.price,'订单取消退款');render()},menuCategory:t=>{menuCategory=t;render()},
editDish:id=>{editingItemId=id;s.tab="edit";render();window.scrollTo(0,0)},
closeEdit:()=>{editingItemId=null;render()},
saveDish:()=>{
  const name=$("dishName").value.trim();
  const category=$("dishCategory").value.trim()||"其他";
  const price=Number($("dishPrice").value);
  const emoji=$("dishEmoji").value.trim()||"🍽️";
  const desc=$("dishDesc").value.trim();
  const on=$("dishEnabled").value==="1";
  if(!name||name.length>50||category.length>20||!Number.isInteger(price)||price<1||price>100000)return alert("请正确填写菜名、分类和积分价格");
  if(editingItemId===null){
    s.menu.push({id:Date.now()+Math.floor(Math.random()*1000),name,category,price,emoji,desc,on});
  }else{
    const i=s.menu.find(i=>i.id===editingItemId);
    if(!i)return alert("没有找到这道菜，请刷新重试");
    Object.assign(i,{name,category,price,emoji,desc,on});
  }
  editingItemId=null;
  render();
  alert("菜单已保存！本设备立即生效。");
},
toggle:id=>{const i=s.menu.find(i=>i.id===id);if(i)i.on=!i.on;render()},
shiftDish:(id,direction)=>{
  const index=s.menu.findIndex(i=>i.id===id),next=index+direction;
  if(index<0||next<0||next>=s.menu.length)return;
  const tmp=s.menu[index];s.menu[index]=s.menu[next];s.menu[next]=tmp;render()
},
remove:id=>{
  const i=s.menu.find(i=>i.id===id);
  if(!i||!confirm("确定永久删除「"+i.name+"」？"))return;
  s.menu=s.menu.filter(x=>x.id!==id);
  if(editingItemId===id)editingItemId=null;
  render()
},
clearMenu:()=>{
  if(!confirm("确定清空所有菜品吗？历史订单会保留。"))return;
  if(!confirm("再次确认：真的清空当前菜单，重新开始？"))return;
  s.menu=[];editingItemId=null;render()
},
restoreMenu:()=>{
  if(!confirm("恢复初始22道菜？这会覆盖本设备现有菜单。"))return;
  s.menu=JSON.parse(JSON.stringify(defaults.menu));editingItemId=null;menuCategory="全部";render()
},
replaceMenu:()=>{
  const input=$("bulktext")?.value.trim();
  if(!input)return alert("请先填写要导入的菜单");
  const rows=input.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(rows.length>250)return alert("一次最多导入250道菜");
  const parsed=[];
  for(let k=0;k<rows.length;k++){
    const seg=rows[k].split(/[|｜]/).map(x=>x.trim());
    if(seg.length<3||seg.length>4||!seg[0]||!seg[1]||seg[0].length>20||seg[1].length>50||!Number.isInteger(Number(seg[2]))||Number(seg[2])<1||Number(seg[2])>100000)return alert("第"+(k+1)+"行格式错误。请使用：分类 | 菜名 | 积分 | 图标");
    parsed.push({id:Date.now()+k+1,category:seg[0],name:seg[1],price:Number(seg[2]),emoji:seg[3]||"🍽️",desc:"老公特供",on:true});
  }
  if(!confirm("这将用"+parsed.length+"道菜替换现有全部菜单，确定吗？"))return;
  s.menu=parsed;editingItemId=null;menuCategory="全部";render();alert("已重建菜单，共"+parsed.length+"道菜！")
}};
$('switchbtn').onclick=()=>{s.role=s.role==='owner'?'customer':'owner';s.tab=s.role==='owner'?'owner':'home';render()};render()
})();
</script></body></html>
